name: consumer-ci

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  call-secureship-pipeline:
    uses: secure-ship/secureship/.github/workflows/secureship-pipeline.yml@v1.0.0
    with:
      app-path: "."
      image-name: "consumer-demo"
      build-branch: "main"
